name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: read
  # Required to look up the CI run of the tagged commit
  actions: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    # Includes waiting for CI to complete if the tag was pushed right after the commit
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Tests already ran on every OS in the CI workflow for this exact commit. Releasing doesn't run them again,
      # so a flaky test or an unavailable MongoDB download server can't block a release that CI already validated.
      - name: Wait for CI to succeed on the tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=""
          for attempt in $(seq 1 20); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then
              break
            fi
            echo "No CI run found yet for $GITHUB_SHA, waiting..."
            sleep 15
          done

          if [ -z "$run_id" ]; then
            echo "::error::No CI run found for $GITHUB_SHA. Run the CI workflow manually on this tag, then re-run this release."
            exit 1
          fi

          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - run: ./build.ps1 -SkipTests
        shell: pwsh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: .output/*.nupkg
          retention-days: 7
          if-no-files-found: error

  # The NuGet API key is only exposed to this job, which doesn't check out, build or run any code from the repository
  publish:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      - name: Push packages to NuGet
        shell: bash
        run: dotnet nuget push "packages/*.nupkg" --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" --skip-duplicate
        env:
          NUGET_SOURCE: ${{ secrets.NUGET_SOURCE }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
